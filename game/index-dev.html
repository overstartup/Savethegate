<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a1030" />
  <title>GateWall</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <style>
    @font-face {
      font-family: 'Luckiest Guy';
      src: url('assets/fonts/luckiest-guy.woff2') format('woff2');
      font-display: swap;
    }

    @font-face {
      font-family: 'Fredoka';
      src: url('assets/fonts/fredoka.woff2') format('woff2');
      font-display: swap;
    }

    /* Arabic + Persian letters (Noto Sans Arabic, OFL) — the two fonts
       above have none, so the browser falls back to this one per letter. */
    @font-face {
      font-family: 'Noto Sans Arabic';
      src: url('assets/fonts/noto-sans-arabic.woff2') format('woff2');
      font-display: swap;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      /* Fills the bands above/below the fixed-aspect canvas on tall phones:
         top half matches the home header strip, bottom half the nav bar. */
      background: linear-gradient(to bottom, #170f33 0%, #170f33 50%, #0e091c 50%, #0e091c 100%);
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      /* no pull-to-refresh */
      touch-action: none;
      /* no pinch zoom / scroll */
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game {
      display: block;
      touch-action: none;
    }
    #nameOverlay {
      display: none; position: fixed; inset: 0; z-index: 10;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #3a2a6e 0%, #1a1036 55%, #0b0718 100%);
      font-family: 'Fredoka', 'Noto Sans Arabic', 'Trebuchet MS', Arial, sans-serif;
    }
    #nameOverlay.rename { background: rgba(8, 4, 20, 0.85); }
    #nameOverlay.rename .ob-logo, #nameOverlay.rename .ob-sub, #nameOverlay.rename .ob-langs { display: none; }
    #nameOverlay:not(.rename) .ob-cancel { display: none; }
    .ob-card {
      width: 320px; max-width: 86vw; box-sizing: border-box; padding: 26px 22px 22px;
      text-align: center; border-radius: 26px; border: 3px solid #ffd23d;
      background: linear-gradient(#3a2878, #1c1240);
      box-shadow: 0 0 34px rgba(255, 210, 61, 0.35), 0 12px 40px rgba(0, 0, 0, 0.6);
    }
    .ob-logo {
      width: 92px; height: 92px; object-fit: contain; display: block; margin: -70px auto 6px;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.6));
    }
    .ob-title {
      font-family: 'Luckiest Guy', 'Noto Sans Arabic', 'Arial Black', Arial, sans-serif;
      color: #ffd23d; font-size: 26px; letter-spacing: 0.5px; line-height: 1.15;
      text-shadow: 0 3px 0 #6a3a10, 0 0 14px rgba(255, 210, 61, 0.4);
    }
    .ob-sub { color: rgba(255, 255, 255, 0.75); font-size: 14px; margin: 8px 0 16px; }
    .ob-langs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 18px; }
    .ob-langs button {
      min-width: 118px; padding: 9px 12px; border-radius: 20px; font-size: 15px; font-weight: 700;
      font-family: inherit; color: rgba(255, 255, 255, 0.8); cursor: pointer;
      background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.2);
    }
    .ob-langs button.on {
      color: #fff; background: linear-gradient(#7fd8ff, #2a7ab0); border-color: #bfeaff;
      box-shadow: 0 0 12px rgba(127, 216, 255, 0.55);
    }
    .ob-label { display: block; color: #7fd8ff; font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    #nameInput {
      width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 12px;
      border: 2px solid #7fd8ff; background: #0d0820; color: #fff; font-size: 17px;
      font-family: inherit; text-align: center; outline: none; -webkit-user-select: text; user-select: text;
    }
    .ob-hint { color: rgba(255, 255, 255, 0.5); font-size: 12px; margin-top: 6px; }
    #nameSubmit {
      margin-top: 16px; width: 100%; padding: 13px; border: none; border-radius: 26px; cursor: pointer;
      font-family: 'Luckiest Guy', 'Noto Sans Arabic', 'Arial Black', Arial, sans-serif; font-size: 20px; color: #fff;
      background: linear-gradient(#6ef598, #2e9a52); box-shadow: 0 4px 0 #1d6a38, 0 0 14px rgba(110, 245, 152, 0.5);
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
    }
    .ob-cancel {
      margin-top: 10px; width: 100%; padding: 9px; border-radius: 20px; cursor: pointer; font-family: inherit;
      font-size: 14px; font-weight: 700; color: rgba(255, 255, 255, 0.75);
      background: transparent; border: 2px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body>
  <div id="wrap"><canvas id="game"></canvas></div>

  <!-- First-run onboarding + rename overlay: real DOM text input (works
       in-browser AND inside the Capacitor WebView, unlike window.prompt).
       src/main.js shows it on first launch (welcome, language, name) and
       again from Settings to change the name. Texts come from src/i18n.js. -->
  <div id="nameOverlay">
    <div class="ob-card">
      <img id="obLogo" class="ob-logo" src="assets/ui/emblem.png" alt="" />
      <div id="obTitle" class="ob-title">Welcome to GateWall!</div>
      <div id="obSub" class="ob-sub">Hold back the horde and save the gate.</div>
      <div id="obLangs" class="ob-langs"></div>
      <label id="obNameLabel" class="ob-label" for="nameInput">Name your Guardian</label>
      <input id="nameInput" maxlength="14" placeholder="Guardian" autocomplete="off" />
      <div id="obHint" class="ob-hint">Shown on the Hall of Fame</div>
      <button id="nameSubmit">START PLAYING</button>
      <button id="nameCancel" class="ob-cancel">CANCEL</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>

</body>

</html>
