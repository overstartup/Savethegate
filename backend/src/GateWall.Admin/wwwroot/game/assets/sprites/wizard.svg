<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gate Guardian: a crystal-armored protector — robe + hood, crystal
       pauldrons on the shoulders, and a faceted gate-shard crystal on the
       hood in place of a plain star, tying the hero visually to the Crystal
       Gate they defend. -->
  <g stroke="#152a44" stroke-width="3" stroke-linejoin="round">
    <!-- robe -->
    <path d="M32 58 Q30 88 26 92 L74 92 Q70 88 68 58 Z" fill="#4a5ea8"/>
    <!-- crystal pauldrons (shoulder armor) -->
    <path d="M20 56 L30 46 L36 58 L26 66 Z" fill="#7fd8ff"/>
    <path d="M80 56 L70 46 L64 58 L74 66 Z" fill="#7fd8ff"/>
    <path d="M20 56 L30 46 L36 58 L26 66 Z" fill="rgba(255,255,255,0.25)" stroke="none"/>
    <!-- head -->
    <circle cx="50" cy="52" r="16" fill="#ffd9b8"/>
    <!-- hood -->
    <path d="M50 8 L30 46 Q50 54 70 46 Z" fill="#33448c"/>
    <path d="M26 46 Q50 56 74 46 L78 50 Q50 62 22 50 Z" fill="#33448c"/>
    <!-- gate-shard crystal (replaces the old star) -->
    <path d="M50 20 L57 28 L52 40 L48 40 L43 28 Z" fill="#9ae6ff" stroke-width="2"/>
  </g>
  <!-- crystal glint on the hood shard -->
  <path d="M48 24 l2 4 -1 4" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- face -->
  <circle cx="44" cy="52" r="2.6" fill="#152a44"/>
  <circle cx="56" cy="52" r="2.6" fill="#152a44"/>
  <path d="M45 60 Q50 64 55 60" stroke="#152a44" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
