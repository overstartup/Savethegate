<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Crystal Gate portal (x2 / x3): icy-blue glowing arch. Curse variant = recolor #b358e0 -->
  <defs>
    <radialGradient id="pg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#bdeeff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5cc8e8" stop-opacity="0.25"/>
    </radialGradient>
  </defs>
  <ellipse cx="50" cy="50" rx="34" ry="42" fill="url(#pg)"/>
  <ellipse cx="50" cy="50" rx="34" ry="42" fill="none" stroke="#7fd8ff" stroke-width="5"/>
  <ellipse cx="50" cy="50" rx="24" ry="32" fill="none" stroke="#bdeeff" stroke-width="2.5" stroke-dasharray="6 7"/>
  <text x="50" y="60" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
        font-size="28" font-weight="900" fill="#fff" stroke="#1c3a52" stroke-width="1.5">×2</text>
</svg>
