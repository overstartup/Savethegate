<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shatterling (goblin-kind): a corrupted crystal creature — same
       silhouette as before, recolored to glassy crystal with jagged crack
       lines and faceted ears, so it reads as "made of cracked crystal"
       rather than a fleshy monster. -->
  <g stroke="#1c3a52" stroke-width="3" stroke-linejoin="round">
    <!-- faceted crystal ears -->
    <path d="M22 40 L8 28 L26 26 Z" fill="#3fae9e"/>
    <path d="M78 40 L92 28 L74 26 Z" fill="#3fae9e"/>
    <!-- body/head blob -->
    <ellipse cx="50" cy="55" rx="30" ry="32" fill="#3fae9e"/>
    <!-- belly -->
    <ellipse cx="50" cy="70" rx="16" ry="12" fill="#6ad4c3" stroke-width="2"/>
  </g>
  <!-- crystal shine -->
  <ellipse cx="38" cy="42" rx="6" ry="9" fill="rgba(255,255,255,0.35)" transform="rotate(-20 38 42)"/>
  <!-- crack lines -->
  <path d="M30 34 L36 48 L28 58" stroke="#173547" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M66 40 L60 52 L68 62" stroke="#173547" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- face -->
  <circle cx="40" cy="46" r="6" fill="#fff"/>
  <circle cx="60" cy="46" r="6" fill="#fff"/>
  <circle cx="41" cy="47" r="3" fill="#1c3a52"/>
  <circle cx="59" cy="47" r="3" fill="#1c3a52"/>
  <path d="M38 60 Q50 68 62 60" stroke="#1c3a52" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M44 61 l0 6 4 -1 0 -4 Z" fill="#fff" stroke="#1c3a52" stroke-width="1.5"/>
</svg>
