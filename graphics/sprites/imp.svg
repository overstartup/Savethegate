<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shatterling (flyer-kind): a fast crystal-winged shard-flyer — violet
       faceted wings and horns, cracked shard body. -->
  <g stroke="#2a1c52" stroke-width="3" stroke-linejoin="round">
    <!-- crystal wings -->
    <path d="M24 46 Q8 36 14 24 Q26 28 32 40 Z" fill="#8a5ac0"/>
    <path d="M76 46 Q92 36 86 24 Q74 28 68 40 Z" fill="#8a5ac0"/>
    <!-- horns -->
    <path d="M38 30 L34 16 L46 26 Z" fill="#b358e0"/>
    <path d="M62 30 L66 16 L54 26 Z" fill="#b358e0"/>
    <!-- body -->
    <circle cx="50" cy="52" r="24" fill="#b358e0"/>
    <!-- tail -->
    <path d="M50 76 Q54 90 66 88" fill="none" stroke-width="3.5"/>
    <path d="M66 88 l8 -4 -2 8 Z" fill="#b358e0" stroke-width="2"/>
  </g>
  <!-- crack line -->
  <path d="M42 32 L48 50 L40 62" stroke="#3d1f5c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- face -->
  <circle cx="42" cy="48" r="5.5" fill="#fff"/>
  <circle cx="58" cy="48" r="5.5" fill="#fff"/>
  <circle cx="43" cy="49" r="2.8" fill="#2a1c52"/>
  <circle cx="57" cy="49" r="2.8" fill="#2a1c52"/>
  <path d="M42 60 Q50 66 58 60" stroke="#2a1c52" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
